---
layout: default
---
<article class="wrap narrow article">
  <p class="eyebrow"><a href="{{ '/camera-corner/' | relative_url }}">Camera Corner</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta">{% if page.author and page.author != "" %}By {{ page.author }} · {% endif %}{{ page.date | date: "%-d %B %Y" }}</p>
  {% if page.image and page.image != "" %}
  <figure class="article-image">
    <img src="{{ page.image | relative_url }}" alt="">
  </figure>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/camera-corner/' | relative_url }}">← More from Camera Corner</a></p>
</article>

<figure class="dg dg-kelvin">
<svg viewBox="0 0 600 400" role="img" aria-label="The colour of light in kelvin"><defs><linearGradient id="kg"><stop offset="0.000" stop-color="#ff8a1e"/><stop offset="0.150" stop-color="#ffb465"/><stop offset="0.312" stop-color="#ffe0b8"/><stop offset="0.438" stop-color="#fff4ea"/><stop offset="0.562" stop-color="#eef2ff"/><stop offset="0.750" stop-color="#cddbff"/><stop offset="1.000" stop-color="#a9c3ff"/></linearGradient></defs><rect width="600" height="400" fill="#14141a"/><rect x="70" y="150" width="460" height="70" rx="10" fill="url(#kg)"/><line x1="70" y1="230" x2="70" y2="250" stroke="#a49d92"/><text x="70" y="268" text-anchor="middle" class="dg-t dg-sub">Candle</text><text x="70" y="286" text-anchor="middle" class="dg-t dg-cap">1,900 K</text><line x1="139" y1="140" x2="139" y2="120" stroke="#a49d92"/><text x="139.0" y="112" text-anchor="middle" class="dg-t dg-sub">Tungsten bulb</text><text x="139.0" y="94" text-anchor="middle" class="dg-t dg-cap">3,200 K</text><line x1="185" y1="230" x2="185" y2="250" stroke="#a49d92"/><text x="185.0" y="268" text-anchor="middle" class="dg-t dg-sub">Golden hour</text><text x="185.0" y="286" text-anchor="middle" class="dg-t dg-cap">4,000 K</text><line x1="271" y1="140" x2="271" y2="120" stroke="#a49d92"/><text x="271.25" y="112" text-anchor="middle" class="dg-t dg-sub">Midday sun</text><text x="271.25" y="94" text-anchor="middle" class="dg-t dg-cap">5,500 K</text><line x1="329" y1="230" x2="329" y2="250" stroke="#a49d92"/><text x="328.75" y="268" text-anchor="middle" class="dg-t dg-sub">Cloudy</text><text x="328.75" y="286" text-anchor="middle" class="dg-t dg-cap">6,500 K</text><line x1="386" y1="140" x2="386" y2="120" stroke="#a49d92"/><text x="386.25" y="112" text-anchor="middle" class="dg-t dg-sub">Open shade</text><text x="386.25" y="94" text-anchor="middle" class="dg-t dg-cap">7,500 K</text><line x1="530" y1="230" x2="530" y2="250" stroke="#a49d92"/><text x="530" y="268" text-anchor="middle" class="dg-t dg-sub">Blue sky</text><text x="530" y="286" text-anchor="middle" class="dg-t dg-cap">10,000 K</text><text x="70" y="330" text-anchor="start" class="dg-t">Warmer light</text><text x="530" y="330" text-anchor="end" class="dg-t">Cooler light</text><text x="300" y="370" text-anchor="middle" class="dg-t dg-sub">Set white balance to the light's temperature and whites come out neutral.</text></svg>
<figcaption><b>The colour of light in kelvin.</b> Low numbers are orange, high numbers are blue. Your camera's white balance presets match these values: tungsten about 3200 K, daylight about 5500 K, shade about 7500 K.</figcaption>
</figure>

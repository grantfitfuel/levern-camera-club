<figure class="dg dg-triangle">
<svg viewBox="0 0 600 400" role="img" aria-label="The exposure triangle"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a3f7d"/><stop offset=".6" stop-color="#c2553a"/><stop offset="1" stop-color="#f6cf74"/></linearGradient></defs><rect width="600" height="400" fill="#14141a"/><path d="M300 50 L130 300 L470 300Z" fill="none" stroke="url(#tg)" stroke-width="4"/><circle cx="300" cy="50" r="34" fill="#1e1e26" stroke="#e0a93f" stroke-width="2"/><circle cx="130" cy="300" r="34" fill="#1e1e26" stroke="#e0a93f" stroke-width="2"/><circle cx="470" cy="300" r="34" fill="#1e1e26" stroke="#e0a93f" stroke-width="2"/><text x="300" y="56" text-anchor="middle" class="dg-t dg-big">f</text><text x="130" y="307" text-anchor="middle" class="dg-t dg-big">1/s</text><text x="470" y="307" text-anchor="middle" class="dg-t dg-big">ISO</text><text x="300" y="112" text-anchor="middle" class="dg-t dg-cap">APERTURE</text><text x="300" y="130" text-anchor="middle" class="dg-t dg-sub">Depth of field: what is sharp</text><text x="130" y="362" text-anchor="middle" class="dg-t dg-cap">SHUTTER SPEED</text><text x="130" y="382" text-anchor="middle" class="dg-t dg-sub">Motion: frozen or blurred</text><text x="470" y="362" text-anchor="middle" class="dg-t dg-cap">ISO</text><text x="470" y="382" text-anchor="middle" class="dg-t dg-sub">Noise: clean or grainy</text><text x="300" y="215" text-anchor="middle" class="dg-t dg-cap">EXPOSURE</text><text x="300" y="236" text-anchor="middle" class="dg-t dg-sub">One stop = double or half the light</text></svg>
<figcaption><b>The exposure triangle.</b> Aperture, shutter speed and ISO each change the brightness by stops, and each has a side effect. Gain a stop on one, give a stop back on another, and the exposure stays the same.</figcaption>
</figure>

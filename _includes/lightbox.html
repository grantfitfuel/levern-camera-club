<dialog class="lightbox" aria-label="Photo viewer">
  <div class="lb-stage">
    <img class="lb-img" alt="">
  </div>
  <div class="lb-caption">
    <div class="lb-main">
      <span class="award lb-award"></span>
      <span class="lb-title"></span>
      <span class="lb-photographer"></span>
      <span class="lb-social"></span>
    </div>
    <div class="lb-details">
      <span class="lb-gear"></span>
      <span class="lb-settings"></span>
      <span class="lb-comp"></span>
    </div>
  </div>
  <button type="button" class="lb-btn lb-close" aria-label="Close">×</button>
  <button type="button" class="lb-btn lb-prev" aria-label="Previous photo">‹</button>
  <button type="button" class="lb-btn lb-next" aria-label="Next photo">›</button>
  <span class="lb-count"></span>
</dialog>

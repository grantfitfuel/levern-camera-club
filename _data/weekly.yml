season: 2026/27
rules: |-
  Photos can be taken using either a camera or a mobile phone camera.
  Entries (with details of which camera was used) must be submitted before 4pm on Tuesday, when voting starts.
  Voting ends on Wednesday at 4pm. Up to 3 votes are allowed per person.
  The photographer with the most points at the end of the season wins the trophy for the summer.

    date: 2026-09-16
    description: Macro photography. Water and glycerin spray droplets on fishing wire, with coloured backgrounds.
  - week: "4"
    date: 2026-09-23
    description: |-
      Reflections photography using a small mirror, plastic or glass sheet.
      Summer Competition hand-in of entries (3 max.). Theme: Seascapes
  - week: "5"
    date: 2026-09-30
    description: |-
      Chess match photography. Portrait of players, close-up of characters.
      Alternative task for the evening: Eye photography
  - week: "6"
    date: 2026-10-07
    description: |-
      Judging of Summer Competition (electronic images only). Theme: Seascapes

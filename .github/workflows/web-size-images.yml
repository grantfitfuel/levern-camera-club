name: Web-size uploaded photos

# Runs whenever a photo is added through Pages CMS (or any push touching images/).
on:
  push:
    branches: [main]
    paths: ["images/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: web-size-images
  cancel-in-progress: false

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python .github/scripts/web_size_images.py
      - name: Commit smaller photos
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Shrink uploaded photos to web size"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

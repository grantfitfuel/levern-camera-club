title: Levern Camera Club
description: Levern Camera Club is a friendly, non-profit photography club in Barrhead, East Renfrewshire. We meet at Fereneze Golf Club at 7.30pm on Wednesdays, September to May. Beginners welcome.
locale: en_GB
logo: /images/site/levern-logo.png
social:
  name: Levern Camera Club
  links:
    - https://www.facebook.com/LevernCameraClub
# Search-engine tags (titles, descriptions, share previews) are added to every page automatically.
plugins:
  - jekyll-seo-tag
# The site lives at leverncameraclub.com (CNAME file). Old address grantfitfuel.github.io/levern-camera-club forwards here.
# To go back to the github.io address: delete CNAME, set baseurl /levern-camera-club and url https://grantfitfuel.github.io.
baseurl: ""
url: https://leverncameraclub.com
show_camera_corner: false
# look: dark (original) or vellum (light paper)
look: vellum

collections:
  competitions:
    output: false
  # Camera Corner is hidden for now (Grant, Nov 2026). To bring it back:
  # set output: true here, show_camera_corner: true below, and remove
  # "published: false" from camera-corner.html.
  camera_corner:
    output: false
    permalink: /camera-corner/:title/

defaults:
  - scope:
      path: ""
      type: camera_corner
    values:
      layout: article
  - scope:
      path: ""
    values:
      layout: default
      image: /images/site/levern-logo.png

exclude:
  - README.md
  - SETUP-GUIDE.md
  - .pages.yml
